<html>
  <!-- Q: What type of content goes inside the <head>? 
    Does it show up on the webpage? -->
  <!-- A: text goes inside head, style sheet links, does not show up on the webpage -->
  <!-- style sheets, file links -->

  <head>
    <!-- links everything together in the html -->
    <title>class 5 demo 😌</title>
    <link href="style.css" rel="stylesheet" />
    <!-- what does the relationship attribute do? does it just tell the code what the thing in the link is? -->
    <!-- fab icon rel="icon" -->

    <!-- NEW: Link JS file -->
     <!-- explicitly links JS files, JS is technically media so it takes source -->
    <script src="main.js"></script>
  </head>

  <!-- Q: What type of content goes inside the <body>? 
    Does it show up on the webpage? -->
  <!-- A: Body is everything that's on the webpage itself, both text and images goes inside the body-->
  <!-- actual materials for the website -->

  <body>
    <p>this is a paragraph</p>
    <p class="blue">this is a second paragraph (.blue)</p>
    <!-- element non specific -->
    <!-- attribute class goes into open tag -->
    <p id="main">this is a third paragraph (#main)</p>

    <div class="blue" id="blue-div"> 
      this is a blue div
    </div>

    <!-- now open up style.css -->
  </body>
</html>
