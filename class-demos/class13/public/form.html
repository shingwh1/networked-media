<!-- you don't have to write a full html file -->

<!-- HTML FORM -->
<!-- Action/Method attribute -->
<!-- action is the route we are going to hit on the server side -->
<!-- method is http method -> GET or POST -->

<form action="/form-upload" method="POST">
  <!-- forms have one required item: submit button -->
  <!-- any other input types need to go before submit -->
  <input type="text" placeholder="write some text" name="new-text" />
  <!-- it needs a name to show up in the console -->
  <input type="submit" value="HIT ME" />
</form>
